-   case: settings_loaded_from_different_files
    disable_cache: true
    main: |
        from typing_extensions import reveal_type
        from django.conf import settings
        # standard settings
        reveal_type(settings.AUTH_USER_MODEL)  # N: Revealed type is "str"
        reveal_type(settings.ROOT_DIR)  # N: Revealed type is "str"
        reveal_type(settings.APPS_DIR)  # N: Revealed type is "pathlib.Path"
        reveal_type(settings.NUMBERS)  # N: Revealed type is "list[str]"
        reveal_type(settings.DICT)  # N: Revealed type is "dict[Any, Any]"
    custom_settings: |
        from base import *
        SECRET_KEY = 112233
        NUMBERS = ['one', 'two']
        DICT = {}  # type: ignore[var-annotated]
    files:
        -   path: base.py
            content: |
                from pathlib import Path
                ROOT_DIR = '/etc'
                APPS_DIR = Path(ROOT_DIR)

-   case: global_settings_are_always_loaded
