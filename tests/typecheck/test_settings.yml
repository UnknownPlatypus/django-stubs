-   case: django_configuration_boots_django_configurations_project
    disable_cache: true
    main: |
        from typing_extensions import reveal_type
        from django.conf import settings

        # `mysettings` can only be imported once the plugin has installed the
        # django-configurations importer, so booting at all proves that worked.
        # Settings are resolved from the `Dev` class, strict mode included:
        reveal_type(settings.CUSTOM_SETTING)  # N: Revealed type is "int"
        reveal_type(settings.NOT_A_SETTING)  # E: 'Settings' object has no attribute 'NOT_A_SETTING'  [misc] # N: Revealed type is "Any"
    custom_settings: |
        from configurations import Configuration

        class Dev(Configuration):
            SECRET_KEY = "1"
            CUSTOM_SETTING = 1
    mypy_config: |
        [mypy]
        ignore_missing_imports = true
        disallow_subclassing_any = false
        [mypy.plugins.django-stubs]
        django_settings_module = mysettings
        django_configuration = Dev


-   case: configuration_class_settings_are_resolved_statically
    disable_cache: true
    main: |
        from typing_extensions import reveal_type
        from django.conf import settings

        # Plain and annotated class attributes:
        reveal_type(settings.CLASS_SETTING)  # N: Revealed type is "int"
        reveal_type(settings.ANNOTATED_SETTING)  # N: Revealed type is "str"

        # The class overrides both global settings and module-level names,
        # matching the runtime precedence of django-configurations:
        reveal_type(settings.EMAIL_SUBJECT_PREFIX)  # N: Revealed type is "int"
        reveal_type(settings.MODULE_SETTING)  # N: Revealed type is "str"

        # Module-level and global settings still resolve:
        reveal_type(settings.MODULE_ONLY_SETTING)  # N: Revealed type is "float"
        reveal_type(settings.AUTH_USER_MODEL)  # N: Revealed type is "str"

        # Unknown settings still error:
        reveal_type(settings.NOT_A_SETTING)  # E: 'Settings' object has no attribute 'NOT_A_SETTING'  [misc] # N: Revealed type is "Any"
    custom_settings: |
        from configurations import Configuration

        MODULE_SETTING = 1
        MODULE_ONLY_SETTING = 1.5

        class Dev(Configuration):
            SECRET_KEY = "1"
            CLASS_SETTING = 1
            ANNOTATED_SETTING: str = "x"
            EMAIL_SUBJECT_PREFIX = 3
            MODULE_SETTING = "x"
    mypy_config: |
        [mypy]
        ignore_missing_imports = true
        disallow_subclassing_any = false
        [mypy.plugins.django-stubs]
        django_settings_module = mysettings
        django_configuration = Dev


