-   case: configuration_class_skips_methods_and_unwraps_properties
    disable_cache: true
    main: |
        from typing_extensions import reveal_type
        from django.conf import settings

        # Properties are evaluated when django-configurations loads settings:
        reveal_type(settings.UPPER_PROPERTY)  # N: Revealed type is "str"

        # Methods and lowercase attributes are not resolved from the class:
        reveal_type(settings.UPPER_METHOD)  # E: 'Settings' object has no attribute 'UPPER_METHOD'  [misc] # N: Revealed type is "Any"
        reveal_type(settings.helper)  # E: 'Settings' object has no attribute 'helper'  [misc] # N: Revealed type is "Any"
    custom_settings: |
        from configurations import Configuration

        class Dev(Configuration):
            SECRET_KEY = "1"

            @property
            def UPPER_PROPERTY(self) -> str:
                return "x"

            def UPPER_METHOD(self) -> int:
                return 1

            helper = "x"
    mypy_config: |
        [mypy]
        ignore_missing_imports = true
        disallow_subclassing_any = false
        [mypy.plugins.django-stubs]
        django_settings_module = mysettings
        django_configuration = Dev


-   case: configuration_class_with_runtime_fallback
    disable_cache: true
    main: |
        from typing_extensions import reveal_type
        from django.conf import settings

        # Class attributes stay precise in non-strict mode:
        reveal_type(settings.TYPED)  # N: Revealed type is "int"

        # `configurations.values` ships no type hints, so those degrade to `Any`:
        reveal_type(settings.FROM_VALUE)  # N: Revealed type is "Any"

        # Settings that only exist at runtime resolve to `Any` in non-strict mode:
        reveal_type(settings.RUNTIME_ONLY)  # N: Revealed type is "Any"
        reveal_type(settings.MISSING)  # E: 'Settings' object has no attribute 'MISSING'  [misc] # N: Revealed type is "Any"
    custom_settings: |
        from configurations import Configuration, values

        # Some code that mypy cannot analyze, but values exist in runtime:
        exec('RUNTIME_ONLY = 1')

        class Dev(Configuration):
            SECRET_KEY = "1"
            TYPED = 1
            FROM_VALUE = values.BooleanValue(False)
    mypy_config: |
        [mypy]
        ignore_missing_imports = true
        disallow_subclassing_any = false
        [mypy.plugins.django-stubs]
        django_settings_module = mysettings
        django_configuration = Dev
        strict_settings = false
