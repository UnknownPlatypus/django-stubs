-   case: autofield_can_be_set_to_none
    main: |
        from myapp.models import MyModel, MyModelExplicitPK
        m = MyModel()
        m.id = 3
        m.id = None
        m2 = MyModel(id=None)
        MyModel.objects.create(id=None)
        MyModel.objects.all().update(id=None) # Should give an error since there's a not-null constraint

        def foo(a: int) -> bool:
          return True
        m2 = MyModel()
        foo(m2.id)

        # At runtime, this would be an error, unless m.save() was called to populate the `id` field.
        # but the plugin cannot catch this.
        foo(m.id)

        exp = MyModelExplicitPK()
        exp.id = 3
        exp.id = None
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models
                class MyModel(models.Model):
                    pass
                class MyModelExplicitPK(models.Model):
                    id = models.AutoField(primary_key=True)

-   case: nullable_foreign_key
    main: |
        from typing_extensions import reveal_type
        from myapp.models import Publisher, Book
        reveal_type(Book().publisher)
        Book().publisher = 11
    out: |
        main:3: note: Revealed type is "myapp.models.Publisher | None"
        main:4: error: Incompatible types in assignment (expression has type "int", variable has type "Publisher | Combinable | None")  [assignment]
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models

                class Publisher(models.Model):
                    pass
                class Book(models.Model):
                    publisher = models.ForeignKey(to=Publisher, on_delete=models.CASCADE, null=True)

-   case: nullable_self_foreign_key
    main: |
        from typing_extensions import reveal_type
        from myapp.models import Inventory
        parent = Inventory()
        core = Inventory(parent_id=parent.id)
        reveal_type(core.parent_id)  # N: Revealed type is "int | None"
        reveal_type(core.parent)  # N: Revealed type is "myapp.models.Inventory | None"
        Inventory(parent=None)
        Inventory(parent_id=None)
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models
                class Inventory(models.Model):
                    parent = models.ForeignKey('self', on_delete=models.SET_NULL, null=True)

-   case: nullable_fk_to_custom_pk_without_type_params_does_not_crash
    monkeypatch: true
    main: |
        from typing_extensions import reveal_type
        from myapp.models import Book
        # A pinned custom PK has no type params, so `target_id` can't carry column `| None`; it must
        # still resolve (to the pk read type) rather than crash the plugin with an IndexError.
        reveal_type(Book().target_id)  # N: Revealed type is "int"
    installed_apps:
        - myapp
    files:
        -   path: myapp/__init__.py
        -   path: myapp/models.py
            content: |
                from django.db import models
                class MyPk(models.IntegerField[int, int]): ...
                class Target(models.Model):
                    code = MyPk(primary_key=True)
                class Book(models.Model):
                    target = models.ForeignKey(Target, on_delete=models.CASCADE, null=True)
